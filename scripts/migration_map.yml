# Migration map: MkDocs `docs/` tree -> Hugo `content/` tree.
#
# Authoritative source: .superpowers/sdd/target-tree.md
#
# Fields
#   old     path relative to `docs/` (null for a new section landing page)
#   new     path relative to `content/`
#   label   navigation title (from the old `mkdocs.yml` nav / target tree)
#   parent  new path of the parent section directory (null for top level)
#   weight  sibling order inside `parent` (10, 20, 30, ... in row order)
#   bundle  true  -> `new` is a leaf bundle directory ending in `/index.md`,
#                    so the destination is a directory; `old` may be any `.md`
#            false -> `new` is a regular page file, or a section page ending in
#                    `/_index.md`
#   action  optional; defaults to `move`
#             move             rename/move `old` to `new`
#             drop             delete `old` (intentionally not migrated)
#             already-migrated `old` was already migrated by hand (root page);
#                              delete `old`, leave the existing `new` untouched
#
# Old paths ending in `/index.md` are moved as a whole directory when `new` ends
# in `/index.md` (bundle), which carries the bundle assets along. When `new` ends
# in `/_index.md` only the file is moved and the sibling pages/assets are mapped
# by their own entries.
#
# Section rows (`old: null`) are created by scripts/migrate/structure.py with
# `title`, `weight`, `approved: none` and a one-sentence body placeholder.

